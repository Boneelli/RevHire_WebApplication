<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RevHire</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-subtle: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: var(--bg-subtle);
            color: var(--text-main);
            overflow: hidden;
        }

        .brand-side {
            flex: 1.2;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
        }

        .brand-side h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -1.5px; }
        .brand-side p { font-size: 1.25rem; opacity: 0.9; line-height: 1.6; max-width: 480px; }

        .form-side {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            margin: auto 0;
        }

        .form-header { margin-bottom: 1.5rem; }
        .form-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .form-header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: var(--text-main); }

        .icon {
            width: 15px;
            height: 15px;
            color: var(--primary);
            flex-shrink: 0;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover { background: var(--primary-dark); }

        .back-link {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link a:hover { color: var(--primary); }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        @media (max-width: 1024px) {
            .brand-side { display: none; }
            .form-side { background: var(--bg-subtle); }
            .form-container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        }

        @media print {
            .brand-side, .back-link, .btn-submit { display: none !important; }
            body, .form-side { display: block; height: auto; overflow: visible; background: #fff; padding: 0; }
            .form-container { max-width: 100%; box-shadow: none; padding: 0; }
        }
    </style>
</head>

<body>

<div class="brand-side">
    <h1>RevHire</h1>
    <p>Join our global community of professionals. Your journey starts here with personalized job recommendations and top-tier talent pools.</p>
</div>

<div class="form-side">
    <div class="form-container">

        <div class="form-header">
            <h2>Create Account</h2>
            <p>Already have an account? <a th:href="@{/auth/login}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log in</a></p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/auth/register}" method="post" th:object="${user}">

            <div class="form-group">
                <label>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    Email Address
                </label>
                <input type="email" th:field="*{email}" placeholder="your@email.com" required />
            </div>

            <div class="form-group">
                <label>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Password
                </label>
                <input type="password"
                       th:field="*{passwordHash}"
                       placeholder="••••••••"
                       required
                       pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$"
                       title="Password must be at least 6 characters long, include 1 uppercase letter, 1 number, and 1 special character (@$!%*?&)" />
                <small style="color:#64748b;">
                    Must contain 6+ characters, 1 uppercase, 1 number, and 1 special symbol.
                </small>
            </div>

            <div class="form-group">
                <label>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Account Role
                </label>
                <select th:field="*{role}" required>
                    <option value="" disabled selected>Who are you?</option>
                    <option value="JOB_SEEKER">Job Seeker</option>
                    <option value="EMPLOYER">Employer</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                    Security Question
                </label>
                <select th:field="*{securityQuestion}" required>
                    <option value="" disabled selected>Select a question...</option>
                    <option value="COLOR">What is your favourite color?</option>
                    <option value="BIRTH_CITY">What is your birth city?</option>
                    <option value="MOTHER_NAME">What is your mother's name?</option>
                    <option value="FIRST_PET">What is the name of your first pet?</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                    Security Answer
                </label>
                <input type="text" th:field="*{securityAnswerHash}" placeholder="Your secret answer" required />
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>

            <div class="back-link">
                <a th:href="@{/auth/login}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    Back to Login
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
