<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RevHire</title>
    <link rel="stylesheet" media="print" href="data:text/css,@media%20print{nav,header,footer,.no-print{display:none!important}body{background:%23fff;color:%23000}}">

    <style>
        :root{
            --primary:#2563eb;
            --primary-dark:#1d4ed8;
            --bg-subtle:#f8fafc;
            --text-main:#0f172a;
            --text-muted:#64748b;
            --border:#e2e8f0;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        }

        body{
            display:flex;
            height:100vh;
            width:100vw;
            background:var(--bg-subtle);
            overflow:hidden;
        }

        .brand-side{
            flex:1.2;
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:0 8%;
        }

        .brand-side h1{
            font-size:4rem;
            font-weight:800;
            margin-bottom:1.5rem;
            letter-spacing:-1.5px;
        }

        .brand-side p{
            font-size:1.25rem;
            opacity:0.9;
            line-height:1.6;
            max-width:480px;
        }

        .form-side{
            flex:1;
            background:white;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px;
            overflow-y:auto;
        }

        .login-box{
            width:100%;
            max-width:400px;
            margin:auto 0;
        }

        .form-group{
            margin-bottom:1.25rem;
        }

        label{
            display:inline-flex;
            align-items:center;
            gap:8px;
            margin-bottom:8px;
            font-weight:600;
            font-size:0.875rem;
            color:var(--text-main);
        }

        label svg{
            color:var(--primary);
            flex-shrink:0;
        }

        input{
            width:100%;
            padding:12px 16px;
            border:1px solid var(--border);
            border-radius:8px;
            font-size:1rem;
            transition:all 0.2s ease;
            outline:none;
        }

        input:focus{
            border-color:var(--primary);
            box-shadow:0 0 0 4px rgba(37,99,235,0.1);
        }

        .password-wrapper{
            position:relative;
        }

        .password-wrapper button{
            position:absolute;
            right:14px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            padding:0;
            display:flex;
            cursor:pointer;
            color:var(--text-muted);
        }

        .btn-login{
            width:100%;
            background:var(--primary);
            color:white;
            padding:14px;
            border:none;
            border-radius:8px;
            font-weight:700;
            cursor:pointer;
            font-size:1rem;
            transition:background 0.2s;
        }

        .btn-login:hover{
            background:var(--primary-dark);
        }

        .back-link{
            margin-top:1rem;
            display:flex;
            align-items:center;
        }

        .back-link a{
            color:var(--text-muted);
            text-decoration:none;
            font-size:0.9rem;
            font-weight:600;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }

        .back-link a:hover{
            color:#2563eb;
            text-decoration:underline;
        }

        @media(max-width:1024px){
            .brand-side{display:none;}
        }
    </style>
</head>

<body>

<div class="brand-side">
    <div>
        <h1>Welcome Back</h1>
        <p>
            Log in to access your applications, manage job postings,
            and stay updated with real-time notifications.
        </p>
    </div>
</div>

<div class="form-side">
    <div class="login-box">
        <h2 style="font-size:2rem;font-weight:700;margin-bottom:0.5rem;">
            Login to RevHire
        </h2>

        <p style="color:var(--text-muted);margin-bottom:2rem;font-size:0.95rem;">
            New to the platform?
            <a th:href="@{/register}" style="color:var(--primary);font-weight:700;text-decoration:none;">
                Create account
            </a>
        </p>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    Email Address
                </label>
                <input type="email" name="email" placeholder="Enter your email" required th:value="${email}">
            </div>

            <div class="form-group">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <label style="margin-bottom:0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        Password
                    </label>
                    <a th:href="@{/auth/forgot-password}" style="font-size:0.8rem;color:var(--primary);font-weight:600;text-decoration:none;">
                        Forgot?
                    </a>
                </div>

                <div class="password-wrapper">
                    <input type="password" name="password" id="passwordField" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" aria-label="Toggle password visibility">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Login
            </button>

            <div class="back-link">
                <a th:href="@{/}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Back to Home
                </a>
            </div>

            <p th:if="${error}" th:text="${error}"
               style="color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;border:1px solid #fecaca;text-align:center;margin-top:1.5rem;font-size:0.875rem;">
            </p>
        </form>
    </div>
</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.getElementById("passwordField");

    togglePassword.addEventListener("click", function() {
        passwordField.type = passwordField.type === "password" ? "text" : "password";
    });
</script>

</body>
</html>
