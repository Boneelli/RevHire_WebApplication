<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Jobs | RevHire</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --sidebar-bg: #0f172a;
            --bg-subtle: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg-subtle);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            line-height: 1.5;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: white;
            position: fixed;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 0 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
        }

        .logo svg { color: var(--primary); }

        .nav-menu {
            list-style: none;
            padding: 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            padding: .7rem 1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: .3s;
            margin-bottom: 2px;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary) !important;
            color: white !important;
        }

        .nav-link.text-danger { color: #f87171; }
        .nav-link.text-danger:hover { background: #dc2626 !important; color: white !important; }
        .mt-auto { margin-top: auto; }

        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .icon-sm {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 2.5rem;
            width: calc(100% - 250px);
        }

        h3 {
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .filter-box {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        .filter-box hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 1.25rem 0;
        }

        .filter-row-top {
            display: grid;
            grid-template-columns: 4fr 3fr 2fr 3fr;
            gap: 1rem;
        }

        .filter-row-bottom {
            display: grid;
            grid-template-columns: 3fr 2fr 2fr 2fr 3fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: .2s;
            font-family: inherit;
        }

        .w-100 { width: 100%; }
        .rounded-pill { border-radius: 50px; }
        .px-3 { padding-left: 1rem; padding-right: 1rem; }
        .px-4 { padding-left: 1.5rem; padding-right: 1.5rem; }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-outline-primary {
            background: transparent;
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-outline-primary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-outline-secondary {
            background: transparent;
            color: #475569;
            border-color: #cbd5e1;
        }
        .btn-outline-secondary:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .job-card {
            background: white;
            padding: 1.8rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            margin-bottom: 1.25rem;
            transition: .3s;
        }

        .job-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .actions-flex {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .company-name {
            color: var(--primary);
            font-weight: 700;
            font-size: .85rem;
            text-transform: uppercase;
        }

        .job-title {
            font-weight: 800;
            font-size: 1.3rem;
            margin: .4rem 0;
        }

        .job-meta {
            font-size: .9rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 0.5rem;
        }

        .job-meta > span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .job-meta svg { color: var(--primary); }

        .applied-badge {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-saved {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
            color: white !important;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        /* Lightweight Modal Notification */
        .toast-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .toast-box {
            background: white;
            padding: 1.75rem 2rem;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }
        .toast-box h4 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .toast-box p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.25rem; }

        @media (max-width: 1000px) {
            .sidebar { width: 80px; }
            .sidebar span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); }
            .filter-row-top, .filter-row-bottom { grid-template-columns: 1fr; }
        }

        @media print {
            .sidebar, .filter-box, .actions-flex, .toast-overlay { display: none !important; }
            .main-content { margin-left: 0; width: 100%; padding: 0; }
            .job-card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
        }
    </style>
</head>

<body>

<nav class="sidebar">
    <a th:href="@{'/jobseeker/dashboard/' + ${session.userId}}" class="logo">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13.13 22.19L11.5 18.36C13.07 17.78 14.54 17 15.9 16.09L13.13 22.19M5.64 12.5L1.81 10.87L7.91 8.1C7 9.46 6.22 10.93 5.64 12.5M21.61 2.39C21.61 2.39 16.66 .269 11 5.93C8.81 8.12 7.5 10.53 6.65 12.64C6.37 13.39 6.56 14.21 7.11 14.77L9.24 16.89C9.79 17.45 10.61 17.63 11.36 17.35C13.5 16.53 15.88 15.19 18.07 13C23.73 7.34 21.61 2.39 21.61 2.39M14.54 9.46C13.76 8.68 13.76 7.41 14.54 6.63S16.59 5.85 17.37 6.63C18.14 7.41 18.15 8.68 17.37 9.46C16.59 10.24 15.32 10.24 14.54 9.46Z"/></svg>

    </a>

    <div class="nav-menu">
        <a th:href="@{'/jobseeker/dashboard/' + ${session.userId}}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/jobseeker/profile/manage}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            <span>Manage Profile</span>
        </a>
        <a th:href="@{/jobseeker/resume/builder}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Resume Builder</span>
        </a>
        <a th:href="@{/jobseeker/resume/view}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>View Resume</span>
        </a>
        <a th:href="@{/jobseeker/resume/upload}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Upload Resume</span>
        </a>
        <a th:href="@{/jobseeker/jobs/search}" class="nav-link active">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Search Jobs</span>
        </a>
        <a th:href="@{/jobseeker/applications}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>

        </a>

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span>Saved Jobs</span>
        </a>
        <a th:href="@{/notifications/notification}" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>

        <a th:href="@{/auth/reset-password}" class="nav-link">

    <div class="mt-auto">
        <a th:href="@{/}" class="nav-link text-danger">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Logout</span>
        </a>

<main class="main-content">
    <h3>Explore Opportunities</h3>

    <div class="filter-box">
        <form id="filterForm" th:action="@{/jobseeker/jobs/search}" method="GET" class="filter-row-top">
            <div>
                <input type="text" id="titleFilter" name="title" class="form-control" placeholder="Job title">
            </div>
            <div>
                <input type="text" id="locationFilter" name="location" class="form-control" placeholder="Location">
            </div>
            <div>
                <button type="submit" class="btn btn-primary w-100">Find Jobs</button>
            </div>
            <div>
                <button type="button" onclick="clearFilters()" class="btn btn-outline-secondary w-100">Clear All</button>
            </div>
        </form>

        <hr>

        <div class="filter-row-bottom">
            <div>
                <input type="text" id="companyFilter" class="form-control" placeholder="Company Name">
            </div>
            <div>
                <input type="number" id="minSalary" class="form-control" placeholder="Min Salary">
            </div>
            <div>
                <input type="number" id="maxSalary" class="form-control" placeholder="Max Salary">
            </div>
            <div>
                <select id="jobTypeFilter" class="form-select">
                    <option value="">Job Type</option>
                    <option value="Full Time">Full Time</option>
                    <option value="Part Time">Part Time</option>
                    <option value="Internship">Internship</option>
                    <option value="Contract">Contract</option>
                </select>
            </div>
            <div>
                <select id="sortJobs" class="form-select">
                    <option value="">Sort Jobs</option>
                    <option value="company">Company</option>
                    <option value="salaryLow">Salary (Low to High)</option>
                    <option value="salaryHigh">Salary (High to Low)</option>
                </select>
            </div>
        </div>
    </div>

    <input type="hidden" id="sessionUserId" th:value="${session.userId}">

    <div id="jobListings">
        <div th:each="job : ${jobs}" class="job-card"
             th:attr="data-jobid=${job.jobId},
                      data-company=${job.companyName},
                      data-title=${job.title},
                      data-location=${job.location},
                      data-type=${job.jobType},
                      data-minsalary=${job.salaryMin},
                      data-maxsalary=${job.salaryMax}">

            <div class="card-header-flex">
                <div>
                    <span class="company-name" th:text="${job.companyName}"></span>
                    <h5 class="job-title" th:text="${job.title}"></h5>
                </div>
                <div class="actions-flex" th:id="'actionContainer-' + ${job.jobId}">
                    <button th:id="'saveBtn-' + ${job.jobId}"
                            th:onclick="'saveJob(' + ${job.jobId} + ')'"
                            class="btn btn-outline-primary rounded-pill px-3">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    </button>
                    <button th:id="'applyBtn-' + ${job.jobId}"
                            th:onclick="'handleApply(' + ${job.jobId} + ')'"
                            class="btn btn-primary rounded-pill px-4">
                        Apply Now
                    </button>
                </div>
            </div>

            <div class="job-meta">
                <span>
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span th:text="${job.location}"></span>
                </span>
                <span>
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <span th:text="${job.salaryMin + ' - ' + job.salaryMax}"></span>
                </span>
                <span>
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span th:text="${job.jobType}"></span>
                </span>
            </div>
        </div>
    </div>
</main>

<!-- Lightweight Modal Notification -->
<div id="customToast" class="toast-overlay">
    <div class="toast-box">
        <h4 id="toastTitle">Notice</h4>
        <p id="toastMessage"></p>
        <button id="toastCloseBtn" class="btn btn-primary px-4" onclick="closeToast()">OK</button>
    </div>
</div>

<script>
    function showToast(title, text, autoCloseMs = 0) {
        const overlay = document.getElementById("customToast");
        document.getElementById("toastTitle").textContent = title;
        document.getElementById("toastMessage").textContent = text;
        document.getElementById("toastCloseBtn").style.display = autoCloseMs > 0 ? "none" : "inline-flex";
        overlay.style.display = "flex";
        if (autoCloseMs > 0) {
            setTimeout(closeToast, autoCloseMs);
        }
    }

    function closeToast() {
        document.getElementById("customToast").style.display = "none";
    }

    const filterIds = ["titleFilter", "locationFilter", "companyFilter", "minSalary", "maxSalary", "jobTypeFilter", "sortJobs"];

    filterIds.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
            element.addEventListener("input", applyFilters);
            if (element.tagName === "SELECT") {
                element.addEventListener("change", applyFilters);
            }
        }
    });

    function applyFilters() {
        const searchTitle = document.getElementById("titleFilter").value.toLowerCase().trim();
        const searchLocation = document.getElementById("locationFilter").value.toLowerCase().trim();
        const searchCompany = document.getElementById("companyFilter").value.toLowerCase().trim();
        const searchMinSal = parseFloat(document.getElementById("minSalary").value) || 0;
        const searchMaxSal = parseFloat(document.getElementById("maxSalary").value) || Infinity;
        const searchType = document.getElementById("jobTypeFilter").value.toLowerCase();

        const jobCards = document.querySelectorAll(".job-card");
        let visibleCount = 0;

        jobCards.forEach(card => {
            const jTitle = (card.dataset.title || "").toLowerCase();
            const jLoc = (card.dataset.location || "").toLowerCase();
            const jComp = (card.dataset.company || "").toLowerCase();
            const jType = (card.dataset.type || "").toLowerCase().replace("_", " ");
            const jMinSal = parseFloat(card.dataset.minsalary || 0);
            const jMaxSal = parseFloat(card.dataset.maxsalary || 0);

            const titleMatch = !searchTitle || jTitle.includes(searchTitle);
            const locMatch = !searchLocation || jLoc.includes(searchLocation);
            const compMatch = !searchCompany || jComp.includes(searchCompany);
            const typeMatch = !searchType || jType.includes(searchType);
            const salaryMatch = (jMaxSal >= searchMinSal) && (jMinSal <= searchMaxSal);

            if (titleMatch && locMatch && compMatch && typeMatch && salaryMatch) {
                card.style.display = "block";
                visibleCount++;
            } else {
                card.style.display = "none";
            }
        });

        toggleNoResults(visibleCount);
    }

    function clearFilters() {
        filterIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = "";
        });

        applyFilters();

        const container = document.getElementById("jobListings");
        const jobs = Array.from(container.querySelectorAll(".job-card"));
        jobs.sort((a, b) => parseInt(a.dataset.jobid) - parseInt(b.dataset.jobid));
        jobs.forEach(job => container.appendChild(job));
    }

    function toggleNoResults(count) {
        let msg = document.getElementById("noJobsMessage");
        if (count === 0) {
            if (!msg) {
                msg = document.createElement("div");
                msg.id = "noJobsMessage";
                msg.className = "empty-state";
                msg.innerHTML = `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><p style="margin-top:0.5rem;font-weight:700;">No jobs found matching these filters.</p>`;
                document.getElementById("jobListings").appendChild(msg);
            }
        } else if (msg) {
            msg.remove();
        }
    }

    document.getElementById("sortJobs").addEventListener("change", function () {
        const criteria = this.value;
        if (!criteria) return;

        const container = document.getElementById("jobListings");
        const jobs = Array.from(container.querySelectorAll(".job-card"));

        jobs.sort((a, b) => {
            if (criteria === "company") {
                return a.dataset.company.localeCompare(b.dataset.company);
            } else if (criteria === "salaryHigh") {
                return parseFloat(b.dataset.maxsalary) - parseFloat(a.dataset.maxsalary);
            } else if (criteria === "salaryLow") {
                return parseFloat(a.dataset.minsalary) - parseFloat(b.dataset.minsalary);
            }
            return 0;
        });

        jobs.forEach(job => container.appendChild(job));
    });

    document.getElementById("filterForm").addEventListener("submit", (e) => e.preventDefault());

    async function handleApply(jobId) {
        const userId = document.getElementById("sessionUserId").value;

        if (!userId) {
            showToast("Login Required", "Please log in to apply.");
            return;
        }

        try {
            const res = await fetch(`/api/resume/details/${userId}`);
            if (!res.ok) {
                showToast("Error", "No resume found. Please create/upload one.");
                return;
            }

            const resume = await res.json();
            const latestFile = resume.files && resume.files.length > 0 ? resume.files[0] : null;
            let resumeIdToSend = resume.resumeId;
            let fileId = latestFile ? latestFile.fileId : null;

            showToast("Applying...", "Submitting your application, please wait.");
            document.getElementById("toastCloseBtn").style.display = "none";

            const params = new URLSearchParams();
            params.append('jobId', jobId);
            params.append('userId', userId);
            params.append('resumeId', resumeIdToSend);
            params.append('coverLetter', localStorage.getItem("revhire_cover_letter") || "");

            if (fileId) {
                params.append('fileId', fileId);
            }

            const applyRes = await fetch('/applications/submit-application', {
                method: "POST",
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });

            if (applyRes.ok) {
                showToast("Applied Successfully!", "Your application has been submitted.", 1500);
                updateToAppliedState(jobId);
            } else if (applyRes.status === 409) {
                showToast("Note", "Already applied for this job.");
                updateToAppliedState(jobId);
            } else {
                showToast("Note", "Already applied for this job.");
                updateToAppliedState(jobId);
            }

        } catch (err) {
            showToast("Error", "Unable to load resumes.");
        }
    }

    function updateToAppliedState(jobId) {
        const btn = document.getElementById(`applyBtn-${jobId}`);
        if (btn) {
            const appliedLabel = document.createElement("span");
            appliedLabel.className = "applied-badge";
            appliedLabel.innerHTML = `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Applied`;
            btn.parentNode.replaceChild(appliedLabel, btn);
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const userId = document.getElementById("sessionUserId").value;
        if (!userId) return;

        try {
            const res = await fetch(`/applications/seeker/${userId}`);
            if (res.ok) {
                const appliedList = await res.json();
                appliedList.forEach(app => {
                    const jobCards = document.querySelectorAll(".job-card");
                    jobCards.forEach(card => {
                        if (card.dataset.jobid == app.jobId || card.dataset.title === app.jobTitle) {
                            updateToAppliedState(card.dataset.jobid);
                        }
                    });
                });
            }
        } catch (e) { console.log("Applied status check failed."); }
    });

    async function saveJob(jobId) {
        const userId = document.getElementById("sessionUserId").value;
        const btn = document.getElementById(`saveBtn-${jobId}`);
        if (!userId) { showToast("Login Required", "Please login first"); return; }
        try {
            const response = await fetch(`/api/jobseeker/favorites/${userId}/${jobId}`, { method: "POST" });
            if (response.ok || response.status === 409) {
                if (response.ok) showToast("Job Saved!", "Added to your saved jobs.", 1200);
                btn.classList.add("btn-saved");
                btn.innerHTML = '<svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
                btn.disabled = true;
            }
        } catch (e) { console.log("Save error", e); }
    }
</script>
</body>
</html>
